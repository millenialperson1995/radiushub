# RadiusHub - Unbound recursivo autoritativo de cache
# Recursao completa + DNSSEC + prefetch + RPZ Hagezi Pro (ads/tracker/malware)
server:
    interface: 127.0.0.1
    interface: ::1
    interface: __RADIUS_IP__
    interface: __MGMT_IP__
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # quem pode consultar
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.10.10.0/30 allow        # rede dedicada RADIUS (MikroTik)
    access-control: 192.168.100.0/24 allow     # rede de gerencia
    access-control: 172.16.0.0/24 allow        # pool PPPoE
    access-control: 100.64.0.0/24 allow        # CGNAT PPPoE

    hide-identity: yes
    hide-version: yes

    # endurecimento
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    qname-minimisation: yes
    minimal-responses: yes
    val-clean-additional: yes
    unwanted-reply-threshold: 10000000
    edns-buffer-size: 1232

    # DNSSEC (ancora do pacote unbound-anchor)
    module-config: "respip validator iterator"

    # performance (2 vCPU / 2GB RAM — ajuste se mudar o hardware)
    num-threads: __THREADS__
    so-reuseport: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    outgoing-range: 8192
    num-queries-per-thread: 4096

    # prefetch + expired: respostas rapidas mesmo sob carga/atraso
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-client-timeout: 1800
    serve-expired-ttl: 86400
    cache-min-ttl: 300
    cache-max-ttl: 86400

    verbosity: 1
    use-syslog: yes

# RPZ Hagezi Pro — bloqueio de ads/trackers/malware (atualizado via cron)
rpz:
    name: "hagezi-pro"
    zonefile: "/var/lib/unbound/hagezi-pro.rpz"
    url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/rpz/pro.txt
    rpz-log: yes
    rpz-log-name: "hagezi-pro"
